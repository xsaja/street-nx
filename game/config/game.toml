# EA's sound engine guard (0x2FC184) is left by a plain dec at each of these: a release fence first, so the next
# thread to enter (sub_0022004B, hooks.cpp) sees what the section wrote. 0x220716 is the init's restore of the count.
[[hook]]
at = 0x220405
call = "SoundGuardLeave"

