# functions the host replaces or calls by name, 0 where the image has none
[symbols]
# Not found by xbe_symbols, identified by hand (see CLAUDE.local.md):
# stores x/y times the multisample factors at device+0x96C/0x970 (BackBufferScale), then calls 0x250F40, ret 8.
D3DDevice_SetBackBufferScale = 0x25DC80
# the twin xbe_symbols left when it took 0x266D5C for SetFilter: same bytes, 0x1C before it, as in MVP
# (SetEG 0x54A256, SetFilter 0x54A272); its internals touch the APU, which crashed on a null pointer.
IDirectSoundBuffer_SetEG = 0x266D40
# between StopEx and SetLoopRegion as MVP's unnamed 0x54A30A; the game calls it with 1 and 0 over its voices
IDirectSoundBuffer_Pause = 0x266DF4
# 0x251B80: SetState(0), count + 1, then the push buffer reservation; 0x251BA0 stores the push pointer, ret 4
D3DDevice_BeginPush = 0x251B80
D3DDevice_EndPush = 0x251BA0
